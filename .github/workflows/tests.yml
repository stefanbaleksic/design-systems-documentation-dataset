name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests (standard library only, no network)
        run: python3 -I -m unittest discover -s tests
      - name: Release consistency (VERSION, release.json, CHANGELOG, checksums)
        run: python3 -I scripts/release.py check
